<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Step 3</title>
    <style>
        body{font-family:Arial; background: white; display:flex; justify-content:center; padding:30px;}
        form{background:white; padding:25px; border-radius:12px; width:450px;}
        fieldset{border:2px solid #ff6b35; padding:20px;}
        legend{font-weight:bold; color:#ff6b35;}
        input, textarea{width:95%; padding:10px; margin:8px 0; border-radius:6px; border:1px solid #ccc;}
        .btn{padding:10px 20px; border:none; border-radius:6px; color:white; text-decoration:none; display:inline-block; cursor:pointer;}
        .submit{background:green; float:right;} .back{background:grey;}
    </style>
</head>
<body>
    <form>
        <fieldset>
            <legend>Step 3 of 3 - Cooking Experience</legend>
            <label>Can you cook this dish?</label><br>
            <input type="radio" name="cook" style="width:auto;"> Yes
            <input type="radio" name="cook" style="width:auto;"> No
            <br><br>
            <label>Rate your cooking skill (1-10):</label><br>
            <input type="number" min="1" max="10" placeholder="7"><br>
            <label>Your secret ingredient / tip:</label><br>
            <textarea rows="3" placeholder="Write here..."></textarea>
            <br><br>
            <a href="form2.html" class="btn back">Back</a>
            <button type="submit" class="btn submit">Submit</button>
        </fieldset>
    </form>
</body>
</html>
