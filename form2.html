<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Step 2</title>
    <style>
        body{font-family:Arial; background: white; display:flex; justify-content:center; padding:30px;}
        form{background:white; padding:25px; border-radius:12px; width:450px;}
        fieldset{border:2px solid #ff6b35; border-radius:8px; padding:20px;}
        legend{font-weight:bold; color:#ff6b35;}
        input, select{width:95%; padding:10px; margin:8px 0; border-radius:6px; border:1px solid #ccc;}
        .btn{padding:10px 20px; border:none; border-radius:6px; color:white; text-decoration:none; display:inline-block;}
        .next{background:#ff6b35; float:right;} .back{background:grey;}
    </style>
</head>
<body>
    <form>
        <fieldset>
            <legend>Step 2 of 3 - Favorite Food</legend>
            <label>What type of food do you like?</label><br>
            <select>
                <option>Pakistani</option>
                <option>Italian</option>
                <option>Chinese</option>
                <option>Fast Food</option>
                <option>Desserts</option>
            </select><br>
            <label>Your Favorite Dish Name:</label><br>
            <input type="text" placeholder="e.g. Biryani, Pizza, Pasta"><br>
            <label>How often do you eat it?</label><br>
            <input type="radio" name="freq" style="width:auto;"> Daily
            <input type="radio" name="freq" style="width:auto;"> Weekly
            <input type="radio" name="freq" style="width:auto;"> Rarely
            <br><br>
            <a href="form1.html" class="btn back">Back</a>
            <a href="form3.html" class="btn next">Next</a>
        </fieldset>
    </form>
</body>
</html>
